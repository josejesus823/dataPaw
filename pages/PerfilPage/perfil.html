<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Account Information</title>
    <link rel="stylesheet" href="stylePerfil.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="../../shared/auth.js"></script>
</head>

<body>

    <div class="profile-page-container">
        <div class="profile-card">

            <h1 class="main-title">account information</h1>

            <div class="user-header">
                <div class="user-avatar" id="user-avatar"></div>
                <div class="user-info">
                    <span class="user-name" id="display-name">Loading...</span>
                    <span class="user-email" id="display-email">Loading...</span>
                </div>
            </div>

            <hr class="separator">

            <div id="message" class="message" style="display: none;"></div>
            
            <form class="account-form" id="profile-form">

                <div class="form-field">
                    <label for="full-name">Full Name:</label>
                    <input type="text" id="full-name" name="name" required>
                </div>

                <div class="form-field">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-field">
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone">
                </div>

                <div class="form-field">
                    <label for="birth-date">Date of Birth:</label>
                    <input type="date" id="birth-date" name="dateOfBirth">
                </div>

                <div class="form-field">
                    <label for="role">Role:</label>
                    <input type="text" id="role" name="role" readonly>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-save">Save Changes</button>
                    <button type="button" class="btn btn-cancel" id="cancel-btn">Cancel</button>
                    <button type="button" class="btn btn-logout" id="logout-btn">Logout</button>
                </div>
            </form>

            <hr class="separator">
            
            <!-- Password Change Section -->
            <div class="password-section">
                <h2 class="section-title">Change Password</h2>
                
                <form class="password-form" id="password-form">
                    <div class="form-field">
                        <label for="current-password">Current Password:</label>
                        <input type="password" id="current-password" name="currentPassword" required>
                    </div>
                    
                    <div class="form-field">
                        <label for="new-password">New Password:</label>
                        <input type="password" id="new-password" name="newPassword" required minlength="6">
                        <span class="field-hint">Minimum 6 characters</span>
                    </div>
                    
                    <div class="form-field">
                        <label for="confirm-password">Confirm New Password:</label>
                        <input type="password" id="confirm-password" name="confirmPassword" required>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-save">Change Password</button>
                        <button type="button" class="btn btn-reset" id="password-reset-btn">Reset Form</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="perfil.js"></script>
</body>

</html>
