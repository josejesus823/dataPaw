<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | Información de Cuenta</title>
    <link rel="stylesheet" href="/pages/PerfilPage/stylePerfil.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="profile-page-container">
        <div class="profile-card">

            <h1 class="main-title">account information</h1>

            <div class="user-header">
                <div class="user-avatar"></div>
                <div class="user-info">
                    <span class="user-name">María García</span>
                    <span class="user-email">MariaGarcia@email.com</span>
                </div>
            </div>

            <hr class="separator">

            <form class="account-form">

                <div class="form-field">
                    <label for="full-name">Full Name :</label>
                    <input type="text" id="full-name" value="">
                </div>

                <div class="form-field">
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" value="">
                </div>

                <div class="form-field">
                    <label for="address">Address:</label>
                    <input type="text" id="address" value="">
                </div>

                <div class="form-field">
                    <label for="stratum">Stratum:</label>
                    <input type="text" id="stratum" value="">
                </div>

                <div class="form-field">
                    <label for="salary">Salary:</label>
                    <input type="text" id="salary" value="">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-save">Save</button>
                    <button type="button" class="btn btn-cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
