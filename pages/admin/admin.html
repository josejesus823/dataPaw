<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataPaw - Administration Panel</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="../../shared/auth.js"></script>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="../../assets/img/logo.png" alt="DataPaw Logo">
      <span class="brand-name">DataPaw Admin</span>
    </div>

    <nav>
      <ul>
        <li><a href="../Home/home.html">HOME</a></li>
        <li><a href="../adoptionPage/adoption.html">ADOPT</a></li>
        <li><a href="../dashboard/dashboard.html">DASHBOARD</a></li>
        <li><a href="../PerfilPage/perfil.html">PROFILE</a></li>
        <li><a href="../admin/admin.html" class="active">ADMIN</a></li>
      </ul>
    </nav>

    <div class="auth-buttons">
      <span id="welcomeMessage" class="welcome-msg"></span>
      <button class="btn btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-container">
      <h1>Administration Panel</h1>
      
      <div class="admin-tabs">
        <button class="tab-btn active" onclick="showTab('users')">User List</button>
        <button class="tab-btn" onclick="showTab('stats')">Stadistics</button>
      </div>

      <div id="users-tab" class="tab-content active">
        <div class="section-header">
          <h2>Users registered</h2>
          <button class="btn btn-primary" onclick="showCreateUserModal()">Create User</button>
        </div>

        <div class="users-table-container">
          <table class="users-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Registration Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
            </tbody>
          </table>
        </div>
      </div>

      <div id="stats-tab" class="tab-content">
        <h2>System Statistics</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <h3 id="totalUsers">0</h3>
            <p>Total Users</p>
          </div>
          <div class="stat-card">
            <h3 id="totalAdmins">0</h3>
            <p>Admins</p>
          </div>
          <div class="stat-card">
            <h3 id="totalRegularUsers">0</h3>
            <p>Regular Users</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="createUserModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Create new Users</h3>
        <span class="close" onclick="closeCreateUserModal()">&times;</span>
      </div>
      <form id="createUserForm">
        <div class="form-group">
          <label for="userName">Name:</label>
          <input type="text" id="userName" name="name" required>
        </div>
        <div class="form-group">
          <label for="userEmail">Email:</label>
          <input type="email" id="userEmail" name="email" required>
        </div>
        <div class="form-group">
          <label for="userPassword">Password:</label>
          <input type="password" id="userPassword" name="password" required>
        </div>
        <div class="form-group">
          <label for="userRole">Rol:</label>
          <select id="userRole" name="role" required>
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeCreateUserModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Users</button>
        </div>
      </form>
    </div>
  </div>

  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Confirm Delete Users</h3>
        <span class="close" onclick="closeDeleteModal()">&times;</span>
      </div>
      <p>¿Do you want to delete this user?</p>
      <div class="form-actions">
        <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <script>
    let userToDelete = null;

    function initAdmin() {
      if (!AuthService.requireAdmin()) return;
      
      const user = AuthService.getCurrentUser();
      document.getElementById('welcomeMessage').textContent = `Admin: ${user.name}`;
      
      loadUsers();
      updateStats();
    }

    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      
      document.getElementById(tabName + '-tab').classList.add('active');
      event.target.classList.add('active');
      
      if (tabName === 'stats') {
        updateStats();
      }
    }

    function loadUsers() {
      const users = UserService.getAllUsers();
      const tbody = document.getElementById('usersTableBody');
      
      tbody.innerHTML = users.map(user => `
        <tr>
          <td>${user.id}</td>
          <td>${user.name}</td>
          <td>${user.email}</td>
          <td><span class="role-badge ${user.role}">${user.role === 'admin' ? 'Admin' : 'Usuario'}</span></td>
          <td>${user.createdAt}</td>
          <td>
            <button class="btn btn-danger btn-sm" onclick="showDeleteModal(${user.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function updateStats() {
      const users = UserService.getAllUsers();
      const admins = users.filter(u => u.role === 'admin');
      const regularUsers = users.filter(u => u.role === 'user');
      
      document.getElementById('totalUsers').textContent = users.length;
      document.getElementById('totalAdmins').textContent = admins.length;
      document.getElementById('totalRegularUsers').textContent = regularUsers.length;
    }

    function showCreateUserModal() {
      document.getElementById('createUserModal').style.display = 'block';
    }

    function closeCreateUserModal() {
      document.getElementById('createUserModal').style.display = 'none';
      document.getElementById('createUserForm').reset();
    }

    function showDeleteModal(userId) {
      userToDelete = userId;
      document.getElementById('deleteModal').style.display = 'block';
    }

    function closeDeleteModal() {
      userToDelete = null;
      document.getElementById('deleteModal').style.display = 'none';
    }

    function confirmDelete() {
      if (userToDelete) {
        UserService.deleteUser(userToDelete);
        loadUsers();
        updateStats();
        closeDeleteModal();
      }
    }

    function logout() {
      AuthService.logout();
    }

    document.getElementById('createUserForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const formData = new FormData(this);
      const userData = {
        name: formData.get('name'),
        email: formData.get('email'),
        password: formData.get('password'),
        role: formData.get('role')
      };

      try {
        UserService.createUser(userData);
        loadUsers();
        updateStats();
        closeCreateUserModal();
      } catch (error) {
        alert('Error creating user');
      }
    });

    window.onclick = function(event) {
      const createModal = document.getElementById('createUserModal');
      const deleteModal = document.getElementById('deleteModal');
      
      if (event.target === createModal) {
        closeCreateUserModal();
      }
      if (event.target === deleteModal) {
        closeDeleteModal();
      }
    }

    document.addEventListener('DOMContentLoaded', initAdmin);
  </script>
</body>
</html>
