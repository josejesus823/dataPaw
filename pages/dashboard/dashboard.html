<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataPaw - Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="../../shared/auth.js"></script>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="../../assets/img/logo.png" alt="DataPaw Logo">
      <span class="brand-name">DataPaw</span>
    </div>

    <nav>
      <ul>
        <li><a href="../Home/home.html">HOME</a></li>
        <li><a href="../adoptionPage/adoption.html">ADOPT</a></li>
        <li><a href="../dashboard/dashboard.html" class="active">DASHBOARD</a></li>
        <li><a href="../PerfilPage/perfil.html">PROFILE</a></li>
        <li id="adminLink" style="display: none;"><a href="../admin/admin.html">ADMIN</a></li>
      </ul>
    </nav>

    <div class="auth-buttons">
      <span id="welcomeMessage" class="welcome-msg"></span>
      <button class="btn btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="dashboard-container">
      <h1>Welcome to DataPaw</h1>
      <div class="user-actions">
        <div class="action-card">
          <h3>Adoptions</h3>
          <p>Find your perfect companion</p>
          <a href="/pages/adoptionPage/adoption.html" class="btn btn-primary">View Adoptions</a>
        </div>
        <div class="action-card">
          <h3>My Profile</h3>
          <p>Manage your personal information</p>
          <a href="/pages/PerfilPage/perfil.html" class="btn btn-primary">View Profile</a>
        </div>
        <div id="adminCard" class="action-card admin-only" style="display: none;">
          <h3>Admin Panel</h3>
          <p>Manage users and content</p>
          <a href="/pages/admin/admin.html" class="btn btn-admin">Manage</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    function initDashboard() {
      if (!AuthService.requireAuth()) return;
      
      const user = AuthService.getCurrentUser();
      document.getElementById('welcomeMessage').textContent = `Hello, ${user.name}`;
      
      if (AuthService.isAdmin()) {
        document.getElementById('adminLink').style.display = 'block';
        document.getElementById('adminCard').style.display = 'block';
      }
    }

    function logout() {
      AuthService.logout();
    }

    document.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
